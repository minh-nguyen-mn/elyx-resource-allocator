<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Allocator | Elyx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="https://images.squarespace-cdn.com/content/v1/68d24af5fc6a2d3ce44f3853/d5c8e1ab-304c-49f8-a3a3-64eec5ae5381/favicon.ico?format=100w">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/timegrid@6.1.15/index.global.min.js"></script>
<style>
:root {
  --bg: #EFEDEB;
  --card-bg: #FFFFFF;
  --text: #2B2B2B;
  --text-muted: #8A8A8A;
  --text-dim: #B0B0B0;
  --border: #E0DDD9;
  --border-light: #E8E6E3;
  --gold: #D4AF37;
  --gold-hover: #C4A030;
  --header-bg: #000000;
  --shadow: 0 2px 6px rgba(0,0,0,0.06);
  --radius: 6px;
  --radius-pill: 50px;
  --font-ui: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display: 'Cormorant Garamond', Georgia, serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  font-weight: 400;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.header {
  background: var(--header-bg);
  padding: 0 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 64px;
  border-bottom: 2px solid var(--gold);
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 16px;
  height: 100%;
}

.header-logo {
  height: 28px;
  display: block;
}

.header-logo img {
  height: 28px;
  display: block;
}

.header-divider {
  width: 1px;
  height: 24px;
  background: rgba(255,255,255,0.2);
}

.header-title-area {
  display: flex;
  flex-direction: column;
}

.header-title {
  font-size: 13px;
  font-weight: 500;
  color: #fff;
  letter-spacing: 0.3px;
}

.header-subtitle {
  font-size: 10px;
  color: rgba(255,255,255,0.5);
  font-weight: 400;
  letter-spacing: 0.5px;
}

.stats-bar {
  display: flex;
  gap: 8px;
}

.stat {
  background: rgba(255,255,255,0.06);
  border-radius: 4px;
  padding: 6px 12px;
  text-align: center;
  min-width: 62px;
}

.stat .value {
  font-size: 15px;
  font-weight: 600;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}

.stat .label {
  font-size: 8px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: rgba(255,255,255,0.45);
  margin-top: 1px;
}

.main {
  max-width: 1440px;
  margin: 0 auto;
  padding: 20px;
}

.layout {
  display: flex;
  gap: 20px;
}

.sidebar { width: 270px; flex-shrink: 0; }

@media (max-width: 900px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; }
  .header { height: auto; padding: 12px 20px; flex-direction: column; gap: 10px; }
  .stats-bar { width: 100%; justify-content: center; }
}

.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  overflow: hidden;
  border: 1px solid var(--border-light);
}

.card-header {
  padding: 12px 16px;
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border-light);
  color: var(--text-muted);
}

.card-body { padding: 12px 16px; }
.card-body table { width: 100%; border-collapse: collapse; font-size: 12px; }
.card-body td { padding: 5px 4px; border-bottom: 1px solid var(--border-light); }
.card-body td:first-child { color: var(--text-muted); }
.card-body .num { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  transition: opacity .15s, background .15s;
  border: 1px solid var(--border);
  background: var(--card-bg);
}

.legend-item:hover { background: #F5F5F5; }
.legend-item.dimmed { opacity: 0.3; }

.legend-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

#calendar {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 12px;
  box-shadow: var(--shadow);
  flex: 1;
  min-height: 600px;
  border: 1px solid var(--border-light);
}

.fc { font-size: 13px; font-family: var(--font-ui); }
.fc .fc-toolbar-title { font-size: 16px !important; font-weight: 500 !important; font-family: var(--font-display); }
.fc .fc-button {
  font-size: 10px !important; padding: 4px 10px !important;
  border-radius: var(--radius-pill) !important;
  background: var(--card-bg) !important;
  border: 1px solid var(--border) !important;
  color: var(--text) !important;
  font-weight: 400 !important;
  text-transform: uppercase !important;
  letter-spacing: 0.5px !important;
  transition: all .15s !important;
}
.fc .fc-button-primary:not(:disabled):hover { background: #F5F5F5 !important; }
.fc .fc-button-primary:not(:disabled).fc-button-active { background: #000 !important; border-color: #000 !important; color: #fff !important; }
.fc .fc-today-button { font-weight: 500 !important; }
.fc .fc-today-button:disabled { opacity: 0.4 !important; }
.fc .fc-event { border-radius: 2px; padding: 1px 3px; font-size: 10px; border: none; cursor: pointer; font-weight: 400; }
.fc .fc-daygrid-more-link { font-size: 10px; color: var(--text-muted); }
.fc .fc-timegrid-slot { height: 24px; }
.fc .fc-col-header-cell-cushion {
  font-weight: 500; color: var(--text-muted);
  text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px;
}
.fc .fc-daygrid-day-number { font-size: 12px; color: var(--text); }
.fc .fc-day-today .fc-daygrid-day-number { font-weight: 600; color: #000; }
.fc .fc-day-today { background: rgba(0,0,0,0.02) !important; }
.fc .fc-non-business { background: #F7F6F4; }
.fc .fc-scrollgrid { border-color: var(--border-light) !important; }
.fc .fc-scrollgrid-section > td { border-color: var(--border-light) !important; }
.fc .fc-daygrid-day-frame { border-color: var(--border-light) !important; }
.fc .fc-popover { border-radius: var(--radius) !important; box-shadow: 0 4px 20px rgba(0,0,0,0.12) !important; border: 1px solid var(--border) !important; }
.fc .fc-popover-title { font-family: var(--font-display); font-size: 13px; }
.fc .fc-more-popover .fc-daygrid-more { font-size: 11px; }

.tooltip-content { display: none; }

.fc-event.event-fitness { background: #1B5E20; border-color: #1B5E20; color: #fff; }
.fc-event.event-food { background: #6D4C41; border-color: #6D4C41; color: #fff; }
.fc-event.event-medication { background: #9B2226; border-color: #9B2226; color: #fff; }
.fc-event.event-therapy { background: #5C2E7A; border-color: #5C2E7A; color: #fff; }
.fc-event.event-consultation { background: #1A237E; border-color: #1A237E; color: #fff; }
.travel-block { background: var(--gold) !important; border-color: var(--gold) !important; color: #000 !important; font-weight: 600; }
.fc-event.event-skipped { background: #D5D2CE !important; border-color: #C5C2BE !important; color: #8A8A8A !important; font-weight: 400; font-style: italic; text-decoration: line-through; }

.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  display: none; align-items: center; justify-content: center;
  z-index: 1000; backdrop-filter: blur(1px);
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card-bg);
  border-radius: var(--radius);
  width: 520px; max-width: 90vw; max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 8px 30px rgba(0,0,0,0.12);
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-header h2 { font-size: 16px; font-weight: 500; font-family: var(--font-display); }
.modal-close {
  background: none; border: none; font-size: 22px;
  cursor: pointer; color: var(--text-dim); line-height: 1;
  padding: 0 2px; transition: color .15s;
}
.modal-close:hover { color: var(--text); }
.modal-body { padding: 16px 20px; }
.modal-body .field { margin-bottom: 10px; }
.modal-body .field-label {
  font-size: 9px; text-transform: uppercase;
  letter-spacing: 0.6px; color: var(--text-dim); margin-bottom: 2px; font-weight: 500;
}
.modal-body .field-value { font-size: 13px; color: var(--text); }

.footer {
  text-align: center;
  padding: 16px 20px;
  font-size: 10px;
  color: var(--text-dim);
  border-top: 1px solid var(--border-light);
  margin-top: 20px;
}
.footer a { color: #000; text-decoration: none; font-weight: 500; }
.footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <a href="https://www.elyx.life/" target="_blank" class="header-logo">
      <img src="https://images.squarespace-cdn.com/content/v1/68d24af5fc6a2d3ce44f3853/ec91d45f-f1ea-44e8-bc7a-82409475505f/Elyx+Icon+%2B+Word+Logo+-+White.png" alt="Elyx">
    </a>
    <div class="header-divider"></div>
    <div class="header-title-area">
      <span class="header-title">Resource Allocator</span>
      <span class="header-subtitle">Personalised Health Action Plan &middot; Jun 15 &ndash; Sep 15, 2026</span>
    </div>
  </div>
  <div class="stats-bar" id="statsBar">
    <div class="stat"><div class="value" id="statPlaced">0</div><div class="label">Placed</div></div>
    <div class="stat"><div class="value" id="statRequested">0</div><div class="label">Requested</div></div>
    <div class="stat"><div class="value" id="statViolations">0</div><div class="label">Violations</div></div>
    <div class="stat"><div class="value" id="statBackups">0</div><div class="label">Backup</div></div>
  </div>
</div>

<div class="main">
  <div class="legend" id="legend"></div>
  <div class="layout">
    <div class="sidebar">
      <div class="card"><div class="card-header">Filters</div><div class="card-body" id="filtersCard"></div></div>
      <div class="card"><div class="card-header">Type Breakdown</div><div class="card-body" id="typeBreakdown"></div></div>
      <div class="card"><div class="card-header">Activities by Priority</div><div class="card-body" id="priorityList" style="max-height:340px;overflow-y:auto"></div></div>
      <div class="card"><div class="card-header">Resource Constraints</div><div class="card-body" id="constraintsList"></div></div>
      <div class="card"><div class="card-header">Skipped Activities</div><div class="card-body" id="skippedList"></div></div>
    </div>
    <div id="calendar"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Activity Details</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="footer">
  <a href="https://www.elyx.life/" target="_blank">Elyx</a> &mdash; Maximizing Your Health &middot; Raffles Hotel Arcade, Singapore
</div>

<script>
const TYPE_COLORS = {
  fitness: '#1B5E20',
  food: '#6D4C41',
  medication: '#9B2226',
  therapy: '#5C2E7A',
  consultation: '#1A237E'
};

const TYPE_LABELS = {
  fitness: 'Fitness / Exercise',
  food: 'Food / Nutrition',
  medication: 'Medication',
  therapy: 'Therapy',
  consultation: 'Consultation'
};

let calendarInstance = null;
let allSchedule = [];
let allTrips = [];
let allActivities = [];
let allSkipped = [];

const PRIORITY_LEVELS = [
  { key: 'critical', label: 'Critical', min: 1, max: 3 },
  { key: 'high', label: 'High', min: 4, max: 10 },
  { key: 'medium', label: 'Medium', min: 11, max: 20 },
  { key: 'low', label: 'Low', min: 21, max: 100 },
];

const filters = {
  types: { fitness: true, food: true, medication: true, therapy: true, consultation: true },
  priorityKeys: new Set(['critical', 'high', 'medium', 'low']),
  showScheduled: true,
  showBackups: true,
  showSkipped: true,
  hiddenActivityIds: new Set()
};

function buildLegend() {
  const el = document.getElementById('legend');
  el.innerHTML = Object.entries(TYPE_LABELS).map(([k,v]) =>
    `<div class="legend-item${filters.types[k]?'':' dimmed'}" onclick="toggleType('${k}')">
      <span class="legend-dot" style="background:${TYPE_COLORS[k]}"></span>${v}
    </div>`
  ).join('') +
    '<div class="legend-item"><span class="legend-dot" style="background:#D4AF37"></span>Travel / Blocked</div>';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function showTravelModal(props) {
  const body = document.getElementById('modalBody');
  const fields = [
    ['Trip', props.destination],
    ['Start', props.start_date],
    ['End', props.end_date],
    ['Purpose', props.purpose || 'N/A']
  ];
  body.innerHTML = fields.map(([label, value]) =>
    `<div class="field"><div class="field-label">${label}</div><div class="field-value">${value}</div></div>`
  ).join('');
  document.getElementById('modalTitle').textContent = props.destination;
  document.getElementById('modalOverlay').classList.add('active');
}

function showSkippedModal(props) {
  const body = document.getElementById('modalBody');
  const fields = [
    ['Activity', props.activity_name],
    ['Type', TYPE_LABELS[props.activity_type] || props.activity_type],
    ['Priority', props.priority <= 3 ? 'Critical' : props.priority <= 10 ? 'High' : props.priority <= 20 ? 'Medium' : 'Low'],
    ['Missed Date', props.missed_date],
    ['Adjustment', props.skip_adjustment]
  ];
  body.innerHTML = fields.map(([label, value]) =>
    `<div class="field"><div class="field-label">${label}</div><div class="field-value">${value}</div></div>`
  ).join('');
  document.getElementById('modalTitle').textContent = props.activity_name;
  document.getElementById('modalOverlay').classList.add('active');
}

function showEventModal(eventProps) {
  const p = eventProps;
  const body = document.getElementById('modalBody');
  const fields = [
    ['Activity', p.activity_name],
    ['Type', TYPE_LABELS[p.activity_type] || p.activity_type],
    ['Priority', p.priority <= 3 ? 'Critical' : p.priority <= 10 ? 'High' : p.priority <= 20 ? 'Medium' : 'Low'],
    ['Duration', p.duration_minutes + ' min'],
    ['Location', p.location || 'N/A'],
    ['Facilitator', p.facilitator || 'Self'],
    ['Equipment', p.equipment_used?.length ? p.equipment_used.join(', ') : 'None'],
    ['Prep', p.prep?.length ? p.prep.join(', ') : 'None'],
    ['Metrics', p.metrics?.length ? p.metrics.join(', ') : 'None'],
    ['Details', p.details || 'N/A'],
    ['Notes', p.notes || '']
  ].filter(f => f[1]);
  body.innerHTML = fields.map(([label, value]) =>
    `<div class="field"><div class="field-label">${label}</div><div class="field-value">${value}</div></div>`
  ).join('');
  document.getElementById('modalTitle').textContent = p.activity_name;
  document.getElementById('modalOverlay').classList.add('active');
}

async function loadData() {
  const resp = await fetch('/api/schedule');
  const data = await resp.json();
  return data;
}

function renderStats(s) {
  document.getElementById('statPlaced').textContent = s.total_activities_placed;
  document.getElementById('statRequested').textContent = s.total_activities_requested;
  document.getElementById('statViolations').textContent = s.constraint_violations;
  document.getElementById('statBackups').textContent = s.backup_activities_used;
}

function renderTypeBreakdown(pbt) {
  const el = document.getElementById('typeBreakdown');
  const total = Object.values(pbt).reduce((a,b) => a+b, 0);
  el.innerHTML = '<table>' +
    Object.entries(pbt).map(([k,v]) =>
      `<tr><td style="border-left:3px solid ${TYPE_COLORS[k]};padding-left:8px">${TYPE_LABELS[k]||k}</td><td class="num">${v}</td><td class="num" style="color:#8A8A8A;width:60px">${Math.round(v/total*100)}%</td></tr>`
    ).join('') +
    `</table>`;
}

function renderFilters() {
  const el = document.getElementById('filtersCard');

  const priorityChecks = PRIORITY_LEVELS.map(p =>
    `<label style="display:flex;align-items:center;gap:4px;font-size:11px;padding:2px 0;cursor:pointer">
      <input type="checkbox" ${filters.priorityKeys.has(p.key)?'checked':''} onchange="togglePriority('${p.key}')" style="accent-color:#D4AF37">
      ${p.label}
    </label>`
  ).join('');

  const viewChecks =
    `<div style="margin-top:6px">
      <div style="font-size:10px;color:#8A8A8A;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.5px">Show</div>
      <label style="display:flex;align-items:center;gap:4px;font-size:12px;padding:2px 0;cursor:pointer">
        <input type="checkbox" ${filters.showScheduled?'checked':''} onchange="filters.showScheduled=!filters.showScheduled;rebuildCalendar()">
        Scheduled
      </label>
      <label style="display:flex;align-items:center;gap:4px;font-size:12px;padding:2px 0;cursor:pointer">
        <input type="checkbox" ${filters.showBackups?'checked':''} onchange="filters.showBackups=!filters.showBackups;rebuildCalendar()">
        Backup
      </label>
      <label style="display:flex;align-items:center;gap:4px;font-size:12px;padding:2px 0;cursor:pointer">
        <input type="checkbox" ${filters.showSkipped?'checked':''} onchange="filters.showSkipped=!filters.showSkipped;rebuildCalendar()">
        Skipped
      </label>
    </div>`;

  const activityToggles =
    `<div style="margin-top:8px;border-top:1px solid #E8E6E3;padding-top:6px">
      <div style="font-size:11px;color:#8A8A8A;cursor:pointer;user-select:none" onclick="toggleActivityList()">
        <span id="activityToggleArrow">▶</span> Per-activity (${allActivities.length})
      </div>
      <div id="activityFilterList" style="display:none;max-height:200px;overflow-y:auto;margin-top:4px;padding-left:8px;border-left:2px solid #E8E6E3">
        ${allActivities.sort((a,b) => a.priority - b.priority).map(a =>
          `<label style="display:flex;align-items:center;gap:4px;font-size:11px;padding:1px 0;cursor:pointer">
            <input type="checkbox" ${filters.hiddenActivityIds.has(a.id)?'':'checked'} onchange="toggleActivity('${a.id}')" style="accent-color:${TYPE_COLORS[a.type]}">
            <span style="color:#8A8A8A;font-size:10px">P${a.priority}</span> ${a.name}
          </label>`
        ).join('')}
      </div>
    </div>`;

  el.innerHTML =
    `<div style="font-size:11px;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;color:#8A8A8A">Priority</div>` +
    `<div style="display:flex;flex-wrap:wrap;gap:0 12px">` + priorityChecks + `</div>` +
    viewChecks +
    activityToggles;
}

function toggleActivityList() {
  const list = document.getElementById('activityFilterList');
  const arrow = document.getElementById('activityToggleArrow');
  const isOpen = list.style.display !== 'none';
  list.style.display = isOpen ? 'none' : 'block';
  arrow.textContent = isOpen ? '▶' : '▼';
}

function toggleType(type) {
  filters.types[type] = !filters.types[type];
  buildLegend();
  rebuildCalendar();
}

function togglePriority(key) {
  if (filters.priorityKeys.has(key)) {
    filters.priorityKeys.delete(key);
  } else {
    filters.priorityKeys.add(key);
  }
  rebuildCalendar();
}

function toggleActivity(id) {
  if (filters.hiddenActivityIds.has(id)) {
    filters.hiddenActivityIds.delete(id);
  } else {
    filters.hiddenActivityIds.add(id);
  }
  rebuildCalendar();
}

function renderPriorityList(activities) {
  const el = document.getElementById('priorityList');
  const sorted = [...activities].sort((a, b) => a.priority - b.priority);
  el.innerHTML = '<table>' +
    sorted.map(a =>
      `<tr><td style="border-left:3px solid ${TYPE_COLORS[a.type]};padding-left:8px">${a.name}</td><td class="num">${a.frequency_times}x/${a.frequency_period}</td><td class="num" style="color:#8A8A8A">P${a.priority}</td></tr>`
    ).join('') +
    '</table>';
}

function renderConstraints(clientSchedule) {
  const el = document.getElementById('constraintsList');
  const trips = clientSchedule.travel_plans || [];
  const blocked = clientSchedule.blocked_dates || [];
  el.innerHTML =
    `<div style="font-size:13px;margin-bottom:8px"><strong>${trips.length}</strong> travel plans</div>` +
    trips.map(t => `<div style="font-size:12px;padding:4px 0;border-bottom:1px solid #E8E6E3;cursor:pointer" onclick="showTravelModal({destination:'${t.destination.replace(/'/g, "\\'")}',start_date:'${t.start_date}',end_date:'${t.end_date}',purpose:'${(t.purpose||'').replace(/'/g, "\\'")}'})">${t.destination}<br><span style="color:#8A8A8A;font-size:11px">${t.start_date} → ${t.end_date}</span></div>`).join('') +
    `<div style="font-size:13px;margin-top:10px"><strong>${blocked.length}</strong> blocked days</div>`;
}

function formatDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function groupMissedDates(dates, period) {
  if (!dates || dates.length === 0) return [];
  if (period === 'day') {
    const sorted = [...dates].sort();
    const ranges = [];
    let start = sorted[0], end = sorted[0];
    for (let i = 1; i < sorted.length; i++) {
      const prev = new Date(end + 'T00:00:00');
      const cur = new Date(sorted[i] + 'T00:00:00');
      const diff = (cur - prev) / 86400000;
      if (diff === 1) {
        end = sorted[i];
      } else {
        ranges.push(start === end ? formatDate(start) : formatDate(start) + ' – ' + formatDate(end));
        start = end = sorted[i];
      }
    }
    ranges.push(start === end ? formatDate(start) : formatDate(start) + ' – ' + formatDate(end));
    return ranges;
  }
  const groups = {};
  const locale = 'en-US';
  const sorted = [...dates].sort();
  for (const d of sorted) {
    const dt = new Date(d + 'T00:00:00');
    let key, label;
    if (period === 'week') {
      const wkStart = new Date(dt);
      wkStart.setDate(dt.getDate() - dt.getDay());
      key = wkStart.toISOString().slice(0, 10);
      label = 'Week of ' + wkStart.toLocaleDateString(locale, { month: 'short', day: 'numeric' });
    } else if (period === 'month') {
      key = d.slice(0, 7);
      label = dt.toLocaleDateString(locale, { month: 'long', year: 'numeric' });
    } else {
      const q = Math.floor(dt.getMonth() / 3) + 1;
      key = dt.getFullYear() + '-Q' + q;
      label = 'Q' + q + ' ' + dt.getFullYear();
    }
    if (!groups[key]) { groups[key] = { label, count: 0 }; }
    groups[key].count++;
  }
  return Object.values(groups).map(g => g.count + 'x ' + g.label);
}

let skippedIdCounter = 0;

function renderSkipped(skipped) {
  const el = document.getElementById('skippedList');
  if (!skipped || skipped.length === 0) {
    el.innerHTML = '<div style="color:#8A8A8A;font-size:13px">No activities skipped</div>';
    return;
  }
  el.innerHTML = skipped.map(s => {
    const act = allActivities.find(a => a.id === s.activity_id);
    const period = act ? act.frequency_period : 'day';
    const allDates = s.missed_dates || [];
    const groups = groupMissedDates(allDates, period);
    const uid = 'skp_' + (++skippedIdCounter);
    const showCount = 5;
    const visible = groups.slice(0, showCount);
    const hidden = groups.slice(showCount);
    const hasMore = hidden.length > 0;
    return `<div style="font-size:12px;padding:6px 0;border-bottom:1px solid #E8E6E3">
      <strong style="color:#9B2226">${allDates.length}x ${s.activity_name}</strong>
      <br><span style="color:#8A8A8A;font-size:11px">${visible.join('; ')}</span>
      ${hasMore ? `<br><span style="color:#D4AF37;font-size:11px;cursor:pointer;font-weight:500" onclick="document.getElementById('${uid}').style.display='inline';this.style.display='none'">+${hidden.length} more...</span>
      <span id="${uid}" style="display:none;color:#8A8A8A;font-size:11px">; ${hidden.join('; ')}</span>` : ''}
      <br><span style="color:#8A8A8A;font-size:11px">↪ ${s.skip_adjustment}</span>
    </div>`;
  }).join('');
}

function getFilteredEvents() {
  return allSchedule.filter(e => {
    if (!filters.types[e.activity_type]) return false;
    const matched = Array.from(filters.priorityKeys).some(key => {
      const level = PRIORITY_LEVELS.find(p => p.key === key);
      return level && e.priority >= level.min && e.priority <= level.max;
    });
    if (!matched) return false;
    const isBackup = e.activity_name.includes('(backup)');
    if (isBackup && !filters.showBackups) return false;
    if (!isBackup && !filters.showScheduled) return false;
    if (filters.hiddenActivityIds.has(e.activity_id)) return false;
    return true;
  });
}

function rebuildCalendar() {
  if (calendarInstance) {
    calendarInstance.destroy();
    calendarInstance = null;
  }
  const filtered = getFilteredEvents();
  buildCalendar(filtered, allTrips);
}

function buildCalendar(events, trips) {
  const calendarEl = document.getElementById('calendar');

  const travelEvents = trips.flatMap(t => {
    const start = new Date(t.start_date);
    const end = new Date(t.end_date);
    end.setDate(end.getDate() + 1);
    return [{
      title: t.destination,
      start: t.start_date,
      end: end.toISOString().split('T')[0],
      allDay: true,
      className: 'travel-block',
      extendedProps: { isTravel: true, destination: t.destination, purpose: t.purpose, start_date: t.start_date, end_date: t.end_date }
    }];
  });

  const skippedEvents = (filters.showSkipped ? allSkipped : []).flatMap(s => {
    const act = allActivities.find(a => a.id === s.activity_id);
    if (!act || act.frequency_period !== 'day') return [];
    if (!filters.types[act.type] || filters.hiddenActivityIds.has(s.activity_id)) return [];
    return (s.missed_dates || []).map(d => ({
      title: s.activity_name,
      start: d,
      allDay: true,
      className: 'event-skipped',
      extendedProps: {
        isSkipped: true,
        activity_name: s.activity_name,
        activity_type: act.type,
        priority: s.priority,
        skip_adjustment: s.skip_adjustment,
        missed_date: d,
        duration_minutes: 0
      }
    }));
  });

  const calEvents = [
    ...events.map(e => ({
      title: e.activity_name,
      start: e.is_all_day ? e.start_datetime.slice(0, 10) : e.start_datetime,
      end: e.is_all_day ? e.end_datetime.slice(0, 10) : e.end_datetime,
      allDay: !!e.is_all_day,
      className: 'event-' + e.activity_type,
      extendedProps: { ...e }
    })),
    ...travelEvents,
    ...skippedEvents
  ];

  calendarInstance = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,timeGridWeek,timeGridDay'
    },
    events: calEvents,
    eventClick: function(info) {
      const props = info.event.extendedProps;
      if (props.isTravel) { showTravelModal(props); return; }
      if (props.isSkipped) { showSkippedModal(props); return; }
      showEventModal(props);
    },
    height: 'auto',
    slotMinTime: '06:00:00',
    slotMaxTime: '22:00:00',
    allDaySlot: true,
    nowIndicator: true,
    eventTimeFormat: { hour: '2-digit', minute: '2-digit' },
    dayMaxEvents: 4,
    moreLinkText: function(n) { return '+' + n + ' more'; }
  });
  calendarInstance.render();
}

(async function() {
  buildLegend();
  const data = await loadData();
  const { schedule, summary, data: fullData } = data;

  allSchedule = schedule;
  allTrips = fullData.client_schedule.travel_plans;
  allActivities = fullData.activities;
  allSkipped = summary.skipped_activities || [];

  renderStats(summary);
  renderTypeBreakdown(summary.placed_by_type);
  renderFilters();
  renderPriorityList(fullData.activities);
  renderConstraints(fullData.client_schedule);
  renderSkipped(summary.skipped_activities);
  buildCalendar(schedule, fullData.client_schedule.travel_plans);
})();
</script>
</body>
</html>
