<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Allocator | Elyx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="https://images.squarespace-cdn.com/content/v1/68d24af5fc6a2d3ce44f3853/d5c8e1ab-304c-49f8-a3a3-64eec5ae5381/favicon.ico?format=100w">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/timegrid@6.1.15/index.global.min.js"></script>
<style>
:root {
  --bg: #EFEDEB;
  --card-bg: #FFFFFF;
  --text: #2B2B2B;
  --text-muted: #8A8A8A;
  --text-dim: #B0B0B0;
  --border: #E0DDD9;
  --border-light: #E8E6E3;
  --gold: #D4AF37;
  --header-bg: #000000;
  --shadow: 0 2px 6px rgba(0,0,0,0.06);
  --radius: 6px;
  --radius-sm: 4px;
  --radius-pill: 50px;
  --font-ui: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-display: 'Cormorant Garamond', Georgia, serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  font-weight: 400;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.header {
  background: var(--header-bg);
  padding: 0 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 64px;
  border-bottom: 2px solid var(--gold);
}

.header-brand { display: flex; align-items: center; gap: 16px; height: 100%; }
.header-logo { height: 28px; display: block; }
.header-logo img { height: 28px; display: block; }
.header-divider { width: 1px; height: 24px; background: rgba(255,255,255,0.2); }
.header-title-area { display: flex; flex-direction: column; }
.header-title { font-size: 13px; font-weight: 500; color: #fff; letter-spacing: 0.3px; }
.header-subtitle { font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 400; letter-spacing: 0.5px; }

.stats-bar { display: flex; gap: 8px; }
.stat {
  background: rgba(255,255,255,0.06);
  border-radius: 4px;
  padding: 6px 12px;
  text-align: center;
  min-width: 62px;
  cursor: pointer;
  transition: background .15s;
}
.stat:hover { background: rgba(255,255,255,0.12); }
.stat .value { font-size: 15px; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
.stat .label { font-size: 8px; text-transform: uppercase; letter-spacing: 0.6px; color: rgba(255,255,255,0.45); margin-top: 1px; }

.main {
  max-width: 1440px;
  margin: 0 auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.layout { display: flex; gap: 20px; align-items: flex-start; }
.sidebar { width: 280px; flex-shrink: 0; }

@media (max-width: 900px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; }
  .header { height: auto; padding: 12px 20px; flex-direction: column; gap: 10px; }
  .header-brand { width: 100%; justify-content: center; }
  .stats-bar { width: 100%; justify-content: center; flex-wrap: wrap; }
  .main { padding: 12px; }
  #calendar { min-height: 400px; }
  .fc .fc-toolbar-title { font-size: 14px !important; }
  .fc .fc-button { font-size: 9px !important; padding: 3px 7px !important; }
  .fc-datejump-input { width: 90px; font-size: 9px; }
  .modal { width: 95vw; max-height: 90vh; }
  .modal-header { padding: 12px 16px; }
  .modal-header h2 { font-size: 14px; }
  .modal-body { padding: 12px 16px; }
}

@media (max-width: 600px) {
  .header { padding: 10px 12px; gap: 8px; }
  .header-logo img { height: 22px; }
  .header-title { font-size: 11px; }
  .header-subtitle { font-size: 9px; }
  .stat { padding: 4px 8px; min-width: 50px; }
  .stat .value { font-size: 13px; }
  .stat .label { font-size: 7px; }
  .main { padding: 8px; gap: 10px; }
  .layout { gap: 10px; }
  #calendar { min-height: 300px; padding: 6px; }
  .card-header { padding: 8px 10px; font-size: 9px; }
  .card-body { padding: 8px 10px; }
  .card-body.compact { padding: 4px 10px; }
  .fc .fc-toolbar-title { font-size: 12px !important; }
  .fc .fc-button { font-size: 8px !important; padding: 2px 5px !important; letter-spacing: 0.2px !important; }
  .fc-datejump-container { margin-left: 3px; }
  .fc-datejump-input { width: 80px; font-size: 8px; padding: 1px 4px; }
  .fc .fc-col-header-cell-cushion { font-size: 8px; }
  .fc .fc-daygrid-day-number { font-size: 10px; }
  .fc .fc-event { font-size: 8px; padding: 1px 2px; }
  .fc .fc-daygrid-more-link { font-size: 8px; }
  .legend-item { font-size: 9px; padding: 3px 8px; }
  .activity-item { font-size: 10px; padding: 3px 0; }
  .activity-item .act-name { font-size: 10px; }
  .act-details { padding: 4px 6px 4px 18px; font-size: 10px; }
  .act-detail-lbl { width: 60px; font-size: 9px; }
  .sort-controls select { font-size: 9px; padding: 2px 4px; }
  .select-all-bar button { font-size: 9px; padding: 1px 6px; }
  .skipped-item { font-size: 10px; padding: 4px 0; }
  .skipped-detail { padding: 4px 6px 4px 38px; font-size: 10px; }
  .modal { width: 98vw; }
  .modal-header { padding: 10px 12px; }
  .modal-header h2 { font-size: 13px; }
  .modal-body { padding: 10px 12px; }
  .modal-body .field-value { font-size: 12px; }
  .footer { font-size: 9px; padding: 10px 12px; }
  .act-expand { width: 14px; font-size: 7px; }
  .act-sort-val { font-size: 8px; }
}

.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 6px;
  overflow: hidden;
  border: 1px solid var(--border-light);
}

.card-header {
  padding: 10px 14px;
  font-weight: 600;
  font-size: 10px;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border-light);
  color: var(--text-muted);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-body { padding: 10px 14px; }
.card-body.compact { padding: 6px 14px; }
.card-body table { width: 100%; border-collapse: collapse; font-size: 12px; }
.card-body td { padding: 5px 4px; border-bottom: 1px solid var(--border-light); }
.card-body td:first-child { color: var(--text-muted); }
.card-body .num { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text); }

.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend-item {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--text-muted); cursor: pointer;
  padding: 4px 10px; border-radius: var(--radius-pill);
  transition: opacity .15s, background .15s;
  border: 1px solid var(--border); background: var(--card-bg);
}
.legend-item:hover { background: #F5F5F5; }
.legend-item.dimmed { opacity: 0.3; }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

#calendar {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 12px;
  box-shadow: var(--shadow);
  flex: 1;
  min-height: 600px;
  border: 1px solid var(--border-light);
}

.fc { font-size: 13px; font-family: var(--font-ui); }
.fc .fc-toolbar-title { font-size: 16px !important; font-weight: 500 !important; font-family: var(--font-display); }
.fc .fc-button {
  font-size: 10px !important; padding: 4px 10px !important;
  border-radius: var(--radius-pill) !important;
  background: var(--card-bg) !important;
  border: 1px solid var(--border) !important;
  color: var(--text) !important;
  font-weight: 400 !important;
  text-transform: uppercase !important;
  letter-spacing: 0.5px !important;
  transition: all .15s !important;
}
.fc .fc-button-primary:not(:disabled):hover { background: #F5F5F5 !important; }
.fc .fc-button-primary:not(:disabled).fc-button-active { background: #000 !important; border-color: #000 !important; color: #fff !important; }
.fc .fc-today-button { font-weight: 500 !important; }
.fc .fc-today-button:disabled { opacity: 0.4 !important; }
.fc-datejump-container {
  display: inline-flex;
  align-items: center;
  margin-left: 6px;
}
.fc-datejump-input {
  font-family: var(--font-ui);
  font-size: 10px;
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--card-bg);
  color: var(--text);
  outline: none;
  width: 100px;
  cursor: pointer;
  line-height: 1.6;
}
.fc-datejump-input:focus { border-color: #000; }
.fc .fc-event { border-radius: 2px; padding: 1px 3px; font-size: 10px; border: none; cursor: pointer; font-weight: 400; }
.fc .fc-daygrid-more-link { font-size: 10px; color: var(--text-muted); }
.fc .fc-timegrid-slot { height: 24px; }
.fc .fc-col-header-cell-cushion { font-weight: 500; color: var(--text-muted); text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; }
.fc .fc-daygrid-day-number { font-size: 12px; color: var(--text); }
.fc .fc-day-today .fc-daygrid-day-number { font-weight: 600; color: #000; }
.fc .fc-day-today { background: rgba(0,0,0,0.02) !important; }
.fc .fc-non-business { background: #F7F6F4; }
.fc .fc-scrollgrid { border-color: var(--border-light) !important; }
.fc .fc-scrollgrid-section > td { border-color: var(--border-light) !important; }
.fc .fc-daygrid-day-frame { border-color: var(--border-light) !important; }
.fc .fc-popover { border-radius: var(--radius) !important; box-shadow: 0 4px 20px rgba(0,0,0,0.12) !important; border: 1px solid var(--border) !important; }
.fc .fc-popover-title { font-family: var(--font-display); font-size: 13px; }
.fc .fc-more-popover .fc-daygrid-more { font-size: 11px; }
.tooltip-content { display: none; }

.event-fitness { background: #1B5E20 !important; border-color: #1B5E20 !important; color: #fff !important; }
.event-food { background: #6D4C41 !important; border-color: #6D4C41 !important; color: #fff !important; }
.event-medication { background: #9B2226 !important; border-color: #9B2226 !important; color: #fff !important; }
.event-therapy { background: #5C2E7A !important; border-color: #5C2E7A !important; color: #fff !important; }
.event-consultation { background: #1A237E !important; border-color: #1A237E !important; color: #fff !important; }
.travel-block { background: var(--gold) !important; border-color: var(--gold) !important; color: #000 !important; font-weight: 600; }
.event-skipped { background: #D5D2CE !important; border-color: #C5C2BE !important; color: #8A8A8A !important; font-weight: 400; font-style: italic; text-decoration: line-through; }

.filter-scroll {
  max-height: 130px;
  overflow-y: auto;
}
.filter-scroll::-webkit-scrollbar { width: 4px; }
.filter-scroll::-webkit-scrollbar-track { background: transparent; }
.filter-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.filter-section-header {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 3px 0 1px;
  user-select: none;
  border-top: 1px solid var(--border-light);
  margin-top: 6px;
  padding-top: 5px;
}
.filter-section-header:hover { color: var(--text); }
.fsec-arrow { font-size: 7px; color: var(--text-dim); }
.fsec-count { font-size: 9px; font-weight: 400; color: var(--text-dim); margin-left: auto; }

.sort-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}

.sort-controls select {
  font-family: var(--font-ui);
  font-size: 10px;
  padding: 3px 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--card-bg);
  color: var(--text);
  outline: none;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.sort-controls select:focus { border-color: #000; }

.sort-toggle {
  font-size: 11px;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--card-bg);
  color: var(--text-muted);
  line-height: 1;
  transition: all .15s;
}

.sort-toggle:hover { background: #F5F5F5; color: var(--text); }

.select-all-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border-light);
}

.select-all-bar button {
  font-family: var(--font-ui);
  font-size: 10px;
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--card-bg);
  color: var(--text-muted);
  cursor: pointer;
  transition: all .15s;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.select-all-bar button:hover { background: #F5F5F5; color: var(--text); }

.activity-list {
  max-height: 260px;
  overflow-y: auto;
}

.activity-list::-webkit-scrollbar { width: 4px; }
.activity-list::-webkit-scrollbar-track { background: transparent; }
.activity-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.activity-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
  font-size: 11px;
  border-bottom: 1px solid var(--border-light);
  cursor: pointer;
  transition: background .1s;
}

.activity-item:hover { background: #FAFAFA; }
.activity-item .act-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.activity-item .act-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.activity-item .act-tag { font-size: 9px; color: var(--text-dim); flex-shrink: 0; }

.skipped-list {
  max-height: 240px;
  overflow-y: auto;
}

.skipped-list::-webkit-scrollbar { width: 4px; }
.skipped-list::-webkit-scrollbar-track { background: transparent; }
.skipped-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.skipped-item {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 5px 0;
  font-size: 11px;
  border-bottom: 1px solid var(--border-light);
}

.skipped-item .skipped-body { flex: 1; min-width: 0; }
.skipped-item .skipped-head { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.skipped-item .skipped-name { color: #9B2226; font-weight: 600; }
.skipped-item .skipped-pri { font-size: 9px; color: var(--text-dim); }
.skipped-item .skipped-session-count { font-size: 9px; color: var(--text-dim); flex-shrink: 0; }
.skipped-item .skipped-dates { color: var(--text-muted); font-size: 10px; margin-top: 1px; }
.skipped-item .skipped-adj { color: var(--text-muted); font-size: 10px; }

.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  display: none; align-items: center; justify-content: center;
  z-index: 1000; backdrop-filter: blur(1px);
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card-bg);
  border-radius: var(--radius);
  width: 520px; max-width: 90vw; max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 8px 30px rgba(0,0,0,0.12);
}
.modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; background: var(--card-bg); z-index: 1;
}
.modal-header h2 { font-size: 16px; font-weight: 500; font-family: var(--font-display); }
.modal-close {
  background: none; border: none; font-size: 22px;
  cursor: pointer; color: var(--text-dim); line-height: 1;
  padding: 0 2px; transition: color .15s;
}
.modal-close:hover { color: var(--text); }
.modal-body { padding: 16px 20px; }
.modal-body .field { margin-bottom: 10px; }
.modal-body .field-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); margin-bottom: 2px; font-weight: 500; }
.modal-body .field-value { font-size: 13px; color: var(--text); }

.act-expand {
  font-size: 8px;
  cursor: pointer;
  color: var(--text-dim);
  flex-shrink: 0;
  width: 16px;
  text-align: center;
  transition: color .15s;
  user-select: none;
}
.act-expand:hover { color: var(--text); }

.act-details {
  padding: 6px 8px 6px 22px;
  font-size: 11px;
  background: #FAFAFA;
  border-bottom: 1px solid var(--border-light);
}
.act-detail-row {
  display: flex;
  gap: 8px;
  padding: 2px 0;
}
.act-detail-lbl {
  color: var(--text-muted);
  width: 80px;
  flex-shrink: 0;
  font-size: 10px;
}
.act-sort-val {
  font-size: 9px;
  color: var(--text-dim);
  flex-shrink: 0;
  margin-right: 4px;
}

.skipped-detail {
  padding: 6px 8px 6px 44px;
  font-size: 11px;
  background: #FAFAFA;
}
.skipped-detail .act-detail-row {
  padding: 1px 0;
}

.footer {
  text-align: center;
  padding: 12px 20px;
  font-size: 10px;
  color: var(--text-dim);
}
.footer a { color: #000; text-decoration: none; font-weight: 500; }
.footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <a href="https://www.elyx.life/" target="_blank" class="header-logo">
      <img src="https://images.squarespace-cdn.com/content/v1/68d24af5fc6a2d3ce44f3853/ec91d45f-f1ea-44e8-bc7a-82409475505f/Elyx+Icon+%2B+Word+Logo+-+White.png" alt="Elyx">
    </a>
    <div class="header-divider"></div>
    <div class="header-title-area">
      <span class="header-title">Resource Allocator</span>
      <span class="header-subtitle">Personalised Health Action Plan &middot; Jun 15 &ndash; Sep 15, 2026</span>
    </div>
  </div>
  <div class="stats-bar" id="statsBar">
    <div class="stat" onclick="showStatModal('placed')"><div class="value" id="statPlaced">0</div><div class="label">Placed</div></div>
    <div class="stat" onclick="showStatModal('requested')"><div class="value" id="statRequested">0</div><div class="label">Requested</div></div>
    <div class="stat" onclick="showStatModal('violations')"><div class="value" id="statViolations">0</div><div class="label">Violations</div></div>
    <div class="stat" onclick="showStatModal('backups')"><div class="value" id="statBackups">0</div><div class="label">Backup</div></div>
  </div>
</div>

<div class="main">
  <div class="layout">
    <div class="sidebar">
      <div class="card">
        <div class="card-header">Filters</div>
        <div class="card-body" id="filtersCard"></div>
      </div>

      <div class="card">
        <div class="card-header">Activities <span id="activityCount" style="font-weight:400;color:var(--text-dim)"></span></div>
        <div class="card-body compact" id="activitiesCard"></div>
      </div>

      <div class="card">
        <div class="card-header">Skipped Activities <span id="skippedCount" style="font-weight:400;color:var(--text-dim)"></span></div>
        <div class="card-body compact" id="skippedCard"></div>
      </div>

      <div class="card">
        <div class="card-header">Travel &amp; Away</div>
        <div class="card-body compact" id="constraintsList"></div>
      </div>

      <div class="card">
        <div class="card-header">Type Breakdown</div>
        <div class="card-body compact" id="typeBreakdown"></div>
      </div>
    </div>
    <div id="calendar"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Details</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="footer">
  <a href="https://www.elyx.life/" target="_blank">Elyx</a> &mdash; Maximizing Your Health &middot; Raffles Hotel Arcade, Singapore
</div>

<script>
const TYPE_COLORS = {
  fitness: '#1B5E20',
  food: '#6D4C41',
  medication: '#9B2226',
  therapy: '#5C2E7A',
  consultation: '#1A237E'
};

const TYPE_LABELS = {
  fitness: 'Fitness / Exercise',
  food: 'Food / Nutrition',
  medication: 'Medication',
  therapy: 'Therapy',
  consultation: 'Consultation'
};

let calendarInstance = null;
let allSchedule = [];
let allTrips = [];
let allActivities = [];
let allSkipped = [];
let allBlockedDates = [];
let summaryData = null;
let sortField = 'priority';
let sortAsc = true;
let _lastPickerDate = '';

const PRIORITY_LEVELS = [
  { key: 'critical', label: 'Critical', range: 'P1\u2013P3', min: 1, max: 3 },
  { key: 'high', label: 'High', range: 'P4\u2013P10', min: 4, max: 10 },
  { key: 'medium', label: 'Medium', range: 'P11\u2013P20', min: 11, max: 20 },
  { key: 'low', label: 'Low', range: 'P21+', min: 21, max: 100 },
];

const DURATION_LABELS = {
  '≤15min': '≤15 min',
  '16-30min': '16–30 min',
  '31-60min': '31–60 min',
  '>60min': '>60 min'
};

function getDurationRange(mins) {
  if (!mins || mins <= 15) return '≤15min';
  if (mins <= 30) return '16-30min';
  if (mins <= 60) return '31-60min';
  return '>60min';
}

const filterSections = { location: false, facilitator: false, frequency: false, duration: false };

const filters = {
  types: { fitness: true, food: true, medication: true, therapy: true, consultation: true },
  priorityKeys: new Set(['critical', 'high', 'medium', 'low']),
  locations: new Set(),
  facilitators: new Set(),
  frequencyPeriods: new Set(),
  durationRanges: new Set(),
  showScheduled: true,
  showBackups: true,
  showSkipped: true,
  hiddenActivityIds: new Set(),
  hiddenSkippedIds: new Set()
};

function getPriorityLabel(pri) {
  if (pri <= 3) return 'P' + pri;
  if (pri <= 10) return 'P' + pri;
  if (pri <= 20) return 'P' + pri;
  return 'P' + pri;
}

function getPriorityClass(pri) {
  if (pri <= 3) return 'critical';
  if (pri <= 10) return 'high';
  if (pri <= 20) return 'medium';
  return 'low';
}

function buildLegend() {
  const el = document.getElementById('legend') || createLegend();
  el.innerHTML = Object.entries(TYPE_LABELS).map(([k,v]) =>
    `<div class="legend-item${filters.types[k]?'':' dimmed'}" onclick="toggleType('${k}')">
      <span class="legend-dot" style="background:${TYPE_COLORS[k]}"></span>${v}
    </div>`
  ).join('') +
    '<div class="legend-item"><span class="legend-dot" style="background:#D4AF37"></span>Travel / Away</div>';
}

function createLegend() {
  const el = document.createElement('div');
  el.className = 'legend'; el.id = 'legend';
  document.querySelector('.main > .layout').before(el);
  return el;
}

function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }

function showStatModal(type) {
  if (!summaryData) return;
  const s = summaryData;
  const body = document.getElementById('modalBody');
  let title, rows;

  if (type === 'placed') {
    title = 'Placed Activities';
    const pbt = s.placed_by_type || {};
    const total = Object.values(pbt).reduce((a,b) => a+b, 0);
    const byMonth = {};
    allSchedule.forEach(e => {
      if (e.activity_name.includes('(backup)')) return;
      const m = e.start_datetime.slice(0, 7);
      byMonth[m] = (byMonth[m] || 0) + 1;
    });
    rows = [
      `<div class="field"><div class="field-label">Total</div><div class="field-value">${total} activities</div></div>`,
      `<div class="field" style="margin-top:14px"><div class="field-label">By Type</div></div>`,
      ...Object.entries(pbt).map(([k,v]) =>
        `<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border-light)"><span style="display:flex;align-items:center;gap:5px"><span style="width:6px;height:6px;border-radius:50%;background:${TYPE_COLORS[k]};display:inline-block"></span>${TYPE_LABELS[k]||k}</span><span style="font-weight:500">${v} (${Math.round(v/total*100)}%)</span></div>`
      ),
      `<div class="field" style="margin-top:14px"><div class="field-label">By Month</div></div>`,
      ...Object.entries(byMonth).sort().map(([m,c]) =>
        `<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border-light)"><span>${new Date(m+'-01').toLocaleDateString('en-US',{month:'long',year:'numeric'})}</span><span style="font-weight:500">${c}</span></div>`
      )
    ];
  } else if (type === 'requested') {
    title = 'Requested Activities';
    rows = [
      `<div class="field"><div class="field-label">Total Requested</div><div class="field-value">${s.total_activities_requested} activities</div></div>`,
      `<div class="field"><div class="field-label">Placed</div><div class="field-value">${s.total_activities_placed} (${Math.round(s.total_activities_placed/s.total_activities_requested*100)}%)</div></div>`
    ];
  } else if (type === 'violations') {
    title = 'Constraint Violations';
    const skippedSessions = (s.skipped_activities||[]).reduce((sum, sa) => sum + (sa.missed_dates||[]).length, 0);
    rows = [
      `<div class="field"><div class="field-label">Total Violations</div><div class="field-value">${s.constraint_violations}</div></div>`,
      `<div class="field"><div class="field-label">Skipped Sessions</div><div class="field-value">${skippedSessions} missed date${skippedSessions!==1?'s':''}</div></div>`,
      `<div class="field"><div class="field-label">Activities Affected</div><div class="field-value">${(s.skipped_activities||[]).length} distinct activit${(s.skipped_activities||[]).length===1?'y':'ies'}</div></div>`,
      `<div class="field"><div class="field-label">Details</div><div class="field-value">Constraint violations are scheduling conflicts detected by the allocator. A single violation can prevent multiple activity sessions from being placed, which is why the skipped sessions count often exceeds the violation count.</div></div>`
    ];
  } else if (type === 'backups') {
    title = 'Backup Activities Used';
    const backupNames = [...new Set(allSchedule.filter(e => e.activity_name.includes('(backup)')).map(e => e.activity_name))];
    rows = [
      `<div class="field"><div class="field-label">Total Backup Events</div><div class="field-value">${s.backup_activities_used}</div></div>`,
      backupNames.length ? `<div class="field" style="margin-top:14px"><div class="field-label">Backup Activities</div></div>` +
        backupNames.map(n => `<div style="font-size:12px;padding:3px 0;border-bottom:1px solid var(--border-light)">${n}</div>`).join('') : ''
    ];
  }

  body.innerHTML = rows.join('');
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalOverlay').classList.add('active');
}

function showTravelModal(props) {
  const body = document.getElementById('modalBody');
  const fields = [
    ['Trip', props.destination],
    ['Start', props.start_date],
    ['End', props.end_date],
    ['Purpose', props.purpose || 'N/A']
  ];
  body.innerHTML = fields.map(([label, value]) =>
    `<div class="field"><div class="field-label">${label}</div><div class="field-value">${value}</div></div>`
  ).join('');
  document.getElementById('modalTitle').textContent = props.destination;
  document.getElementById('modalOverlay').classList.add('active');
}

function showEventModal(eventProps) {
  const p = eventProps;
  const body = document.getElementById('modalBody');
  const fields = [
    ['Activity', p.activity_name],
    ['Type', TYPE_LABELS[p.activity_type] || p.activity_type],
    ['Priority', getPriorityLabel(p.priority)],
    ['Duration', p.duration_minutes + ' min'],
    ['Location', p.location || 'N/A'],
    ['Facilitator', p.facilitator || 'Self'],
    ['Equipment', p.equipment_used?.length ? p.equipment_used.join(', ') : 'None'],
    ['Prep', p.prep?.length ? p.prep.join(', ') : 'None'],
    ['Metrics', p.metrics?.length ? p.metrics.join(', ') : 'None'],
    ['Details', p.details || 'N/A'],
    ['Notes', p.notes || '']
  ].filter(f => f[1]);
  body.innerHTML = fields.map(([label, value]) =>
    `<div class="field"><div class="field-label">${label}</div><div class="field-value">${value}</div></div>`
  ).join('');
  document.getElementById('modalTitle').textContent = p.activity_name;
  document.getElementById('modalOverlay').classList.add('active');
}

async function loadData() {
  const resp = await fetch('/api/schedule');
  return await resp.json();
}

function renderStats(s) {
  summaryData = s;
  document.getElementById('statPlaced').textContent = s.total_activities_placed;
  document.getElementById('statRequested').textContent = s.total_activities_requested;
  document.getElementById('statViolations').textContent = s.constraint_violations;
  document.getElementById('statBackups').textContent = s.backup_activities_used;
}

function renderTypeBreakdown(pbt) {
  const el = document.getElementById('typeBreakdown');
  const total = Object.values(pbt).reduce((a,b) => a+b, 0);
  el.innerHTML = '<table>' +
    Object.entries(pbt).map(([k,v]) =>
      `<tr><td style="border-left:3px solid ${TYPE_COLORS[k]};padding-left:8px">${TYPE_LABELS[k]||k}</td><td class="num">${v}</td><td class="num" style="color:#8A8A8A;width:60px">${Math.round(v/total*100)}%</td></tr>`
    ).join('') + '</table>';
}

function sortActivities(activities) {
  const sorted = [...activities];
  const cmp = sortAsc ? 1 : -1;
  sorted.sort((a, b) => {
    let r = 0;
    switch (sortField) {
      case 'priority': r = a.priority - b.priority; break;
      case 'alpha': r = a.name.localeCompare(b.name); break;
      case 'frequency': r = (b.frequency_times || 0) - (a.frequency_times || 0); break;
      case 'duration': r = (a.duration_minutes || 0) - (b.duration_minutes || 0); break;
      case 'type': r = Object.keys(TYPE_LABELS).indexOf(a.type) - Object.keys(TYPE_LABELS).indexOf(b.type); break;
      case 'location': r = (a.location || '').localeCompare(b.location || ''); break;
      case 'facilitator': r = (a.facilitator || '').localeCompare(b.facilitator || ''); break;
    }
    return r * cmp;
  });
  return sorted;
}

function selectAllActivities(show) {
  if (show) {
    filters.hiddenActivityIds.clear();
  } else {
    allActivities.forEach(a => filters.hiddenActivityIds.add(a.id));
  }
  renderActivities();
  rebuildCalendar();
}

function toggleActExpand(id, el) {
  const detail = document.getElementById('actDetail_' + id);
  if (!detail) return;
  const expanded = detail.style.display !== 'none';
  detail.style.display = expanded ? 'none' : 'block';
  if (el) el.textContent = expanded ? '\u25B6' : '\u25BC';
}

function getSortIndicator(a) {
  switch (sortField) {
    case 'duration': return a.duration_minutes ? a.duration_minutes + ' min' : '';
    case 'frequency': return a.frequency_times ? a.frequency_times + '/' + (a.frequency_period||'') : '';
    case 'type': return TYPE_LABELS[a.type] || a.type;
    case 'location': return a.location || '';
    case 'facilitator': return a.facilitator || '';
    default: return '';
  }
}

function renderActivities() {
  const countEl = document.getElementById('activityCount');
  const listEl = document.getElementById('activitiesCard');
  const oldScroll = listEl.querySelector('.activity-list');
  const savedScrollTop = oldScroll ? oldScroll.scrollTop : 0;
  countEl.textContent = `(${allActivities.length})`;

  const sortOpts = [
    { value: 'priority', label: 'Priority' },
    { value: 'alpha', label: 'A\u2013Z' },
    { value: 'frequency', label: 'Frequency' },
    { value: 'duration', label: 'Duration' },
    { value: 'type', label: 'Type' },
    { value: 'location', label: 'Location' },
    { value: 'facilitator', label: 'Facilitator' },
  ];

  const sorted = sortActivities(allActivities);
  const visibleCount = sorted.filter(a => !filters.hiddenActivityIds.has(a.id)).length;
  const allHidden = visibleCount === 0;
  const allVisible = visibleCount === sorted.length;

  listEl.innerHTML =
    `<div class="sort-controls">
      <select onchange="sortField=this.value;renderActivities();rebuildCalendar()">
        ${sortOpts.map(o => `<option value="${o.value}" ${sortField===o.value?'selected':''}>${o.label}</option>`).join('')}
      </select>
      <span class="sort-toggle" onclick="sortAsc=!sortAsc;renderActivities();rebuildCalendar()">${sortAsc ? '\u25B2' : '\u25BC'}</span>
    </div>
    <div class="select-all-bar">
      <button onclick="selectAllActivities(true)">${allVisible ? '\u2713' : ''} Select All</button>
      <button onclick="selectAllActivities(false)">Clear All</button>
    </div>
    <div class="activity-list">
      ${sorted.map(a => {
        const checked = !filters.hiddenActivityIds.has(a.id);
        const si = getSortIndicator(a);
        return `<div class="activity-item">
          <span class="act-expand" onclick="toggleActExpand('${a.id}', this)">\u25B6</span>
          <input type="checkbox" ${checked?'checked':''} style="accent-color:${TYPE_COLORS[a.type]}" onchange="toggleActivity('${a.id}')">
          <span class="act-dot" style="background:${TYPE_COLORS[a.type]}"></span>
          <span class="act-name" onclick="toggleActExpand('${a.id}', this.parentElement.querySelector('.act-expand'))">${a.name}</span>
          ${si ? `<span class="act-sort-val">${si}</span>` : ''}
          <span class="act-tag">${getPriorityLabel(a.priority)}</span>
        </div>
        <div class="act-details" id="actDetail_${a.id}" style="display:none">
          <div class="act-detail-row"><span class="act-detail-lbl">Type</span><span>${TYPE_LABELS[a.type]||a.type}</span></div>
          <div class="act-detail-row"><span class="act-detail-lbl">Duration</span><span>${a.duration_minutes || 'N/A'} min</span></div>
          <div class="act-detail-row"><span class="act-detail-lbl">Frequency</span><span>${(a.frequency_times || 'N/A') + ' / ' + (a.frequency_period || 'N/A')}</span></div>
          <div class="act-detail-row"><span class="act-detail-lbl">Location</span><span>${a.location || 'N/A'}</span></div>
          <div class="act-detail-row"><span class="act-detail-lbl">Facilitator</span><span>${a.facilitator || 'Self'}</span></div>
          <div class="act-detail-row"><span class="act-detail-lbl">Equipment</span><span>${a.equipment_needed?.length ? a.equipment_needed.join(', ') : 'None'}</span></div>
          <div class="act-detail-row"><span class="act-detail-lbl">Prep</span><span>${a.prep?.length ? a.prep.join(', ') : 'None'}</span></div>
          ${a.metrics?.length ? `<div class="act-detail-row"><span class="act-detail-lbl">Metrics</span><span>${a.metrics.join(', ')}</span></div>` : ''}
          ${a.notes ? `<div class="act-detail-row"><span class="act-detail-lbl">Notes</span><span>${a.notes}</span></div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
  requestAnimationFrame(() => {
    const newScroll = listEl.querySelector('.activity-list');
    if (newScroll) newScroll.scrollTop = savedScrollTop;
  });
}

function selectAllLocations(show) {
  const vals = [...new Set(allActivities.map(a => a.location).filter(l => l && l.trim()))];
  vals.forEach(l => { if (show) filters.locations.add(l); else filters.locations.delete(l); });
  renderFilters();
  rebuildCalendar();
}

function selectAllFacilitators(show) {
  const vals = [...new Set(allActivities.map(a => a.facilitator).filter(f => f && f.trim()))];
  vals.forEach(f => { if (show) filters.facilitators.add(f); else filters.facilitators.delete(f); });
  renderFilters();
  rebuildCalendar();
}

function collapsibleSection(key, label, count, selectAllFn, checksHtml) {
  const open = filterSections[key];
  return `<div class="filter-section-header" onclick="toggleFilterSection('${key}')">
    <span class="fsec-arrow">${open ? '\u25BC' : '\u25B6'}</span>
    <span>${label}</span>
    <span class="fsec-count">${count}</span>
  </div>
  <div class="filter-section-body" style="${open ? '' : 'display:none'}">
    <div class="select-all-bar" style="margin-bottom:2px;padding-bottom:2px">
      <button onclick="${selectAllFn}(true)">\u2713 All</button>
      <button onclick="${selectAllFn}(false)">Clear</button>
    </div>
    <div class="filter-scroll">${checksHtml}</div>
  </div>`;
}

function renderFilters() {
  const el = document.getElementById('filtersCard');
  const scrollStates = {};
  el.querySelectorAll('.filter-scroll').forEach(s => { scrollStates[s.offsetTop] = s.scrollTop; });

  const priorityCounts = {};
  allActivities.forEach(a => {
    const key = getPriorityClass(a.priority);
    priorityCounts[key] = (priorityCounts[key] || 0) + 1;
  });
  const priorityChecks = PRIORITY_LEVELS.map(p =>
    `<label style="display:flex;align-items:center;gap:4px;font-size:11px;padding:2px 0;cursor:pointer">
      <input type="checkbox" ${filters.priorityKeys.has(p.key)?'checked':''} onchange="togglePriority('${p.key}')" style="accent-color:#D4AF37">
      ${p.label}
      <span style="color:var(--text-dim);font-size:9px">${p.range}</span>
      <span style="color:var(--text-dim);font-size:9px;margin-left:auto">${priorityCounts[p.key]||0}</span>
    </label>`
  ).join('');

  const allLocs = [...new Set(allActivities.map(a => a.location).filter(l => l && l.trim()))].sort();
  const locCounts = {};
  allActivities.forEach(a => { const l = a.location; if (l && l.trim()) locCounts[l] = (locCounts[l]||0)+1; });
  const locChecks = allLocs.map(l =>
    `<label style="display:flex;align-items:center;gap:4px;font-size:11px;padding:1px 0;cursor:pointer">
      <input type="checkbox" ${filters.locations.has(l)?'checked':''} onchange="toggleLocation('${l.replace(/'/g, "\\'")}')" style="accent-color:#D4AF37">
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l}</span>
      <span style="color:var(--text-dim);font-size:9px">${locCounts[l]||0}</span>
    </label>`
  ).join('');
  const locSection = allLocs.length ? collapsibleSection('location', 'Location', allLocs.length, 'selectAllLocations', locChecks) : '';

  const allFacs = [...new Set(allActivities.map(a => a.facilitator).filter(f => f && f.trim()))].sort();
  const facCounts = {};
  allActivities.forEach(a => { const f = a.facilitator; if (f && f.trim()) facCounts[f] = (facCounts[f]||0)+1; });
  const facChecks = allFacs.map(f =>
    `<label style="display:flex;align-items:center;gap:4px;font-size:11px;padding:1px 0;cursor:pointer">
      <input type="checkbox" ${filters.facilitators.has(f)?'checked':''} onchange="toggleFacilitator('${f.replace(/'/g, "\\'")}')" style="accent-color:#D4AF37">
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f}</span>
      <span style="color:var(--text-dim);font-size:9px">${facCounts[f]||0}</span>
    </label>`
  ).join('');
  const facSection = allFacs.length ? collapsibleSection('facilitator', 'Facilitator', allFacs.length, 'selectAllFacilitators', facChecks) : '';

  const allPeriods = [...new Set(allActivities.map(a => a.frequency_period).filter(Boolean))].sort();
  const periodCounts = {};
  allActivities.forEach(a => { const p = a.frequency_period; if (p) periodCounts[p] = (periodCounts[p]||0)+1; });
  const periodChecks = allPeriods.map(p =>
    `<label style="display:flex;align-items:center;gap:4px;font-size:11px;padding:1px 0;cursor:pointer">
      <input type="checkbox" ${filters.frequencyPeriods.has(p)?'checked':''} onchange="toggleFrequencyPeriod('${p}')" style="accent-color:#D4AF37">
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:capitalize">${p}</span>
      <span style="color:var(--text-dim);font-size:9px">${periodCounts[p]||0}</span>
    </label>`
  ).join('');
  const freqSection = allPeriods.length ? collapsibleSection('frequency', 'Frequency', allPeriods.length, 'selectAllFrequencyPeriods', periodChecks) : '';

  const durKeys = Object.keys(DURATION_LABELS);
  const durCounts = {};
  allActivities.forEach(a => { const r = getDurationRange(a.duration_minutes); durCounts[r] = (durCounts[r]||0)+1; });
  const durChecks = durKeys.map(k =>
    `<label style="display:flex;align-items:center;gap:4px;font-size:11px;padding:1px 0;cursor:pointer">
      <input type="checkbox" ${filters.durationRanges.has(k)?'checked':''} onchange="toggleDurationRange('${k}')" style="accent-color:#D4AF37">
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${DURATION_LABELS[k]}</span>
      <span style="color:var(--text-dim);font-size:9px">${durCounts[k]||0}</span>
    </label>`
  ).join('');
  const durSection = durKeys.length ? collapsibleSection('duration', 'Duration', durKeys.length, 'selectAllDurationRanges', durChecks) : '';

  const schedCount = allSchedule.filter(e => !e.activity_name.includes('(backup)')).length;
  const backupCount = allSchedule.filter(e => e.activity_name.includes('(backup)')).length;
  const skippedCount = allSkipped.reduce((sum, s) => sum + (s.missed_dates || []).length, 0);

  const viewChecks =
    `<div style="margin-top:6px;border-top:1px solid var(--border-light);padding-top:5px">
      <div style="font-size:10px;color:#8A8A8A;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.5px">Show</div>
      <label style="display:flex;align-items:center;gap:4px;font-size:12px;padding:2px 0;cursor:pointer">
        <input type="checkbox" ${filters.showScheduled?'checked':''} onchange="filters.showScheduled=!filters.showScheduled;rebuildCalendar()"> Scheduled <span style="color:var(--text-dim);font-size:10px;margin-left:auto">${schedCount}</span>
      </label>
      <label style="display:flex;align-items:center;gap:4px;font-size:12px;padding:2px 0;cursor:pointer">
        <input type="checkbox" ${filters.showBackups?'checked':''} onchange="filters.showBackups=!filters.showBackups;rebuildCalendar()"> Backup <span style="color:var(--text-dim);font-size:10px;margin-left:auto">${backupCount}</span>
      </label>
      <label style="display:flex;align-items:center;gap:4px;font-size:12px;padding:2px 0;cursor:pointer">
        <input type="checkbox" ${filters.showSkipped?'checked':''} onchange="filters.showSkipped=!filters.showSkipped;rebuildCalendar()"> Skipped <span style="color:var(--text-dim);font-size:10px;margin-left:auto">${skippedCount}</span>
      </label>
    </div>`;

  el.innerHTML =
    `<div style="font-size:10px;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;color:#8A8A8A">Priority</div>` +
    `<div style="display:flex;flex-wrap:wrap;gap:0 12px">` + priorityChecks + `</div>` +
    locSection +
    facSection +
    freqSection +
    durSection +
    viewChecks;

  requestAnimationFrame(() => {
    el.querySelectorAll('.filter-scroll').forEach(s => {
      const saved = scrollStates[s.offsetTop];
      if (saved) s.scrollTop = saved;
    });
  });
}

function toggleType(type) {
  filters.types[type] = !filters.types[type];
  buildLegend();
  renderActivities();
  rebuildCalendar();
}

function togglePriority(key) {
  if (filters.priorityKeys.has(key)) filters.priorityKeys.delete(key);
  else filters.priorityKeys.add(key);
  rebuildCalendar();
}

function toggleFilterSection(key) {
  filterSections[key] = !filterSections[key];
  renderFilters();
}

function toggleLocation(val) {
  if (filters.locations.has(val)) filters.locations.delete(val);
  else filters.locations.add(val);
  rebuildCalendar();
}

function toggleFacilitator(val) {
  if (filters.facilitators.has(val)) filters.facilitators.delete(val);
  else filters.facilitators.add(val);
  rebuildCalendar();
}

function toggleFrequencyPeriod(val) {
  if (filters.frequencyPeriods.has(val)) filters.frequencyPeriods.delete(val);
  else filters.frequencyPeriods.add(val);
  rebuildCalendar();
}

function toggleDurationRange(val) {
  if (filters.durationRanges.has(val)) filters.durationRanges.delete(val);
  else filters.durationRanges.add(val);
  rebuildCalendar();
}

function selectAllFrequencyPeriods(show) {
  const vals = [...new Set(allActivities.map(a => a.frequency_period).filter(Boolean))];
  vals.forEach(v => { if (show) filters.frequencyPeriods.add(v); else filters.frequencyPeriods.delete(v); });
  renderFilters();
  rebuildCalendar();
}

function selectAllDurationRanges(show) {
  const vals = Object.keys(DURATION_LABELS);
  vals.forEach(v => { if (show) filters.durationRanges.add(v); else filters.durationRanges.delete(v); });
  renderFilters();
  rebuildCalendar();
}

function toggleActivity(id) {
  if (filters.hiddenActivityIds.has(id)) filters.hiddenActivityIds.delete(id);
  else filters.hiddenActivityIds.add(id);
  renderActivities();
  rebuildCalendar();
}

function renderConstraints(clientSchedule) {
  const el = document.getElementById('constraintsList');
  allTrips = clientSchedule.travel_plans || [];
  allBlockedDates = clientSchedule.blocked_dates || [];
  el.innerHTML =
    `<div style="font-size:12px;margin-bottom:6px"><strong>${allTrips.length}</strong> travel plan${allTrips.length!==1?'s':''}</div>` +
    allTrips.map(t => `<div style="font-size:12px;padding:3px 0;border-bottom:1px solid #E8E6E3;cursor:pointer" onclick="showTravelModal({destination:'${t.destination.replace(/'/g, "\\'")}',start_date:'${t.start_date}',end_date:'${t.end_date}',purpose:'${(t.purpose||'').replace(/'/g, "\\'")}'})">${t.destination}<br><span style="color:#8A8A8A;font-size:11px">${t.start_date} → ${t.end_date}</span></div>`).join('') +
    (allBlockedDates.length ? `<div style="font-size:12px;margin-top:8px"><strong>${allBlockedDates.length}</strong> blocked date${allBlockedDates.length!==1?'s':''}</div>` : '');
}

function formatDate(d) {
  return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function groupMissedDates(dates, period) {
  if (!dates || dates.length === 0) return [];
  if (period === 'day') {
    const sorted = [...dates].sort();
    const ranges = [];
    let start = sorted[0], end = sorted[0];
    for (let i = 1; i < sorted.length; i++) {
      const prev = new Date(end + 'T00:00:00');
      const cur = new Date(sorted[i] + 'T00:00:00');
      const diff = (cur - prev) / 86400000;
      if (diff === 1) { end = sorted[i]; }
      else { ranges.push(start === end ? formatDate(start) : formatDate(start) + ' \u2013 ' + formatDate(end)); start = end = sorted[i]; }
    }
    ranges.push(start === end ? formatDate(start) : formatDate(start) + ' \u2013 ' + formatDate(end));
    return ranges;
  }
  const groups = {};
  const locale = 'en-US';
  const sorted = [...dates].sort();
  for (const d of sorted) {
    const dt = new Date(d + 'T00:00:00');
    let key, label;
    if (period === 'week') {
      const wkStart = new Date(dt); wkStart.setDate(dt.getDate() - dt.getDay());
      key = wkStart.toISOString().slice(0, 10); label = 'Week of ' + wkStart.toLocaleDateString(locale, { month: 'short', day: 'numeric' });
    } else if (period === 'month') {
      key = d.slice(0, 7); label = dt.toLocaleDateString(locale, { month: 'long', year: 'numeric' });
    } else {
      const q = Math.floor(dt.getMonth() / 3) + 1; key = dt.getFullYear() + '-Q' + q; label = 'Q' + q + ' ' + dt.getFullYear();
    }
    if (!groups[key]) groups[key] = { label, count: 0 };
    groups[key].count++;
  }
  return Object.values(groups).map(g => g.count + 'x ' + g.label);
}

let skippedIdCounter = 0;

function toggleSkippedExpand(uid, el) {
  const detail = document.getElementById('skpDetail_' + uid);
  if (!detail) return;
  const expanded = detail.style.display !== 'none';
  detail.style.display = expanded ? 'none' : 'block';
  if (el) el.textContent = expanded ? '\u25B6' : '\u25BC';
}

function selectAllSkipped(show) {
  allSkipped.forEach(s => {
    if (show) filters.hiddenSkippedIds.delete(s.activity_id);
    else filters.hiddenSkippedIds.add(s.activity_id);
  });
  renderSkipped();
  rebuildCalendar();
}

function renderSkipped() {
  const el = document.getElementById('skippedCard');
  const skipped = allSkipped;
  const totalSessions = skipped.reduce((sum, s) => sum + (s.missed_dates || []).length, 0);
  document.getElementById('skippedCount').textContent = `(${totalSessions})`;
  const oldScroll = el.querySelector('.skipped-list');
  const savedScrollTop = oldScroll ? oldScroll.scrollTop : 0;
  if (!skipped || skipped.length === 0) {
    el.innerHTML = '<div style="color:#8A8A8A;font-size:12px">No activities skipped</div>';
    return;
  }

  const allVisible = skipped.every(s => !filters.hiddenSkippedIds.has(s.activity_id));

  skippedIdCounter = 0;
  el.innerHTML = `
    <div class="select-all-bar">
      <button onclick="selectAllSkipped(true)">${allVisible ? '\u2713' : ''} Select All</button>
      <button onclick="selectAllSkipped(false)">Clear All</button>
    </div>
    <div class="skipped-list">${
    skipped.map(s => {
      const act = allActivities.find(a => a.id === s.activity_id);
      const period = act ? act.frequency_period : 'day';
      const allDates = s.missed_dates || [];
      const groups = groupMissedDates(allDates, period);
      const uid = ++skippedIdCounter;
      const showCount = 3;
      const visible = groups.slice(0, showCount);
      const hidden = groups.slice(showCount);
      const hasMore = hidden.length > 0;
      const checked = !filters.hiddenSkippedIds.has(s.activity_id);
      return `<div class="skipped-item">
        <div style="display:flex;align-items:flex-start;gap:6px;width:100%">
          <span class="act-expand" onclick="toggleSkippedExpand(${uid}, this)" style="margin-top:2px">\u25B6</span>
          <input type="checkbox" ${checked?'checked':''} style="accent-color:#D4AF37;margin-top:2px" onchange="toggleSkipped('${s.activity_id}')">
          <div class="skipped-body">
            <div class="skipped-head">
              <span class="skipped-name">${s.activity_name}</span>
              <span class="skipped-session-count">${allDates.length}</span>
              <span class="skipped-pri">${getPriorityLabel(s.priority)}</span>
            </div>
            <div class="skipped-dates">${visible.join('; ')}${hasMore ? '; <span style="color:#D4AF37;cursor:pointer;font-weight:500" onclick="document.getElementById(\'more_'+uid+'\').style.display=\'inline\';this.style.display=\'none\'">+' + hidden.length + ' more...</span><span id="more_'+uid+'" style="display:none">' + hidden.join('; ') + '</span>' : ''}</div>
            <div class="skipped-adj">\u21AA ${s.skip_adjustment}</div>
          </div>
        </div>
        <div class="skipped-detail" id="skpDetail_${uid}" style="display:none">
          ${act ? `
            <div class="act-detail-row"><span class="act-detail-lbl">Type</span><span>${TYPE_LABELS[act.type]||act.type}</span></div>
            <div class="act-detail-row"><span class="act-detail-lbl">Duration</span><span>${act.duration_minutes || 'N/A'} min</span></div>
            <div class="act-detail-row"><span class="act-detail-lbl">Frequency</span><span>${(act.frequency_times || 'N/A') + ' / ' + (act.frequency_period || 'N/A')}</span></div>
            <div class="act-detail-row"><span class="act-detail-lbl">Location</span><span>${act.location || 'N/A'}</span></div>
            <div class="act-detail-row"><span class="act-detail-lbl">Facilitator</span><span>${act.facilitator || 'Self'}</span></div>
            <div class="act-detail-row"><span class="act-detail-lbl">Equipment</span><span>${act.equipment_needed?.length ? act.equipment_needed.join(', ') : 'None'}</span></div>
            ${act.notes ? `<div class="act-detail-row"><span class="act-detail-lbl">Notes</span><span>${act.notes}</span></div>` : ''}
          ` : '<div style="color:var(--text-muted);font-size:11px;padding:4px 0">Activity details not available</div>'}
        </div>
      </div>`;
    }).join('')
  }</div>`;
  requestAnimationFrame(() => {
    const newScroll = el.querySelector('.skipped-list');
    if (newScroll) newScroll.scrollTop = savedScrollTop;
  });
}

function toggleSkipped(id) {
  if (filters.hiddenSkippedIds.has(id)) filters.hiddenSkippedIds.delete(id);
  else filters.hiddenSkippedIds.add(id);
  renderSkipped();
  rebuildCalendar();
}

function getFilteredEvents() {
  return allSchedule.filter(e => {
    if (!filters.types[e.activity_type]) return false;
    const matched = Array.from(filters.priorityKeys).some(key => {
      const level = PRIORITY_LEVELS.find(p => p.key === key);
      return level && e.priority >= level.min && e.priority <= level.max;
    });
    if (!matched) return false;
    const isBackup = e.activity_name.includes('(backup)');
    if (isBackup && !filters.showBackups) return false;
    if (!isBackup && !filters.showScheduled) return false;
    if (filters.hiddenActivityIds.has(e.activity_id)) return false;
    if (filters.locations.size > 0 && !filters.locations.has(e.location || '')) return false;
    if (filters.facilitators.size > 0 && !filters.facilitators.has(e.facilitator || '')) return false;
    if (filters.frequencyPeriods.size > 0 || filters.durationRanges.size > 0) {
      const act = allActivities.find(a => a.id === e.activity_id);
      if (act) {
        if (filters.frequencyPeriods.size > 0 && !filters.frequencyPeriods.has(act.frequency_period || '')) return false;
        if (filters.durationRanges.size > 0 && !filters.durationRanges.has(getDurationRange(act.duration_minutes))) return false;
      }
    }
    return true;
  });
}

function rebuildCalendar() {
  const p = document.getElementById('calendarDatePicker');
  if (p) _lastPickerDate = p.value;
  if (calendarInstance) { calendarInstance.destroy(); calendarInstance = null; }
  buildCalendar(getFilteredEvents(), allTrips);
}

function buildCalendar(events, trips) {
  const calendarEl = document.getElementById('calendar');

  const travelEvents = trips.flatMap(t => {
    const end = new Date(t.end_date);
    end.setDate(end.getDate() + 1);
    return [{ title: t.destination, start: t.start_date, end: end.toISOString().split('T')[0], allDay: true, className: 'travel-block', extendedProps: { isTravel: true, destination: t.destination, purpose: t.purpose, start_date: t.start_date, end_date: t.end_date } }];
  });

  const skippedEvents = (filters.showSkipped ? allSkipped : []).flatMap(s => {
    const act = allActivities.find(a => a.id === s.activity_id);
    if (!act || act.frequency_period !== 'day') return [];
    if (!filters.types[act.type] || filters.hiddenSkippedIds.has(s.activity_id)) return [];
    return (s.missed_dates || []).map(d => ({
      title: s.activity_name, start: d, allDay: true, className: 'event-skipped',
      extendedProps: { isSkipped: true, activity_name: s.activity_name, activity_type: act.type, priority: s.priority, skip_adjustment: s.skip_adjustment, missed_date: d, duration_minutes: 0 }
    }));
  });

  calendarInstance = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
    events: [
      ...events.map(e => ({ title: e.activity_name, start: e.is_all_day ? e.start_datetime.slice(0, 10) : e.start_datetime, end: e.is_all_day ? e.end_datetime.slice(0, 10) : e.end_datetime, allDay: !!e.is_all_day, className: 'event-' + e.activity_type, extendedProps: { ...e } })),
      ...travelEvents, ...skippedEvents
    ],
    eventClick: function(info) {
      const props = info.event.extendedProps;
      if (props.isTravel) { showTravelModal(props); return; }
      if (props.isSkipped) { showSkippedModalFromProps(props); return; }
      showEventModal(props);
    },
    datesSet: function(info) {
      // no-op — picker only updated on user selection
    },
    height: 'auto',
    slotMinTime: '06:00:00', slotMaxTime: '22:00:00',
    allDaySlot: true, nowIndicator: true,
    eventTimeFormat: { hour: '2-digit', minute: '2-digit' },
    dayMaxEvents: 4,
    moreLinkText: function(n) { return '+' + n + ' more'; }
  });
  calendarInstance.render();

  const toolbar = calendarEl.querySelector('.fc-toolbar');
  if (toolbar) {
    const container = document.createElement('span');
    container.className = 'fc-datejump-container';
    container.innerHTML = '<input type="date" id="calendarDatePicker" class="fc-datejump-input" title="Jump to date">';
    toolbar.appendChild(container);
    document.getElementById('calendarDatePicker').addEventListener('change', function() {
      _lastPickerDate = this.value;
      if (calendarInstance && this.value) calendarInstance.gotoDate(this.value);
    });
  }
  const p = document.getElementById('calendarDatePicker');
  if (p) p.value = _lastPickerDate || new Date().toISOString().slice(0, 10);
}

function showSkippedModalFromProps(props) {
  const body = document.getElementById('modalBody');
  const fields = [
    ['Activity', props.activity_name],
    ['Type', TYPE_LABELS[props.activity_type] || props.activity_type],
    ['Priority', getPriorityLabel(props.priority)],
    ['Missed Date', props.missed_date],
    ['Adjustment', props.skip_adjustment]
  ];
  body.innerHTML = fields.map(([label, value]) =>
    `<div class="field"><div class="field-label">${label}</div><div class="field-value">${value}</div></div>`
  ).join('');
  document.getElementById('modalTitle').textContent = props.activity_name;
  document.getElementById('modalOverlay').classList.add('active');
}

(async function() {
  buildLegend();
  const data = await loadData();
  const { schedule, summary, data: fullData } = data;

  allSchedule = schedule;
  allTrips = fullData.client_schedule.travel_plans;
  allActivities = fullData.activities;
  allSkipped = summary.skipped_activities || [];

  const uniqLocs = [...new Set(allActivities.map(a => a.location).filter(l => l && l.trim()))].sort();
  filters.locations = new Set(uniqLocs);
  const uniqFacs = [...new Set(allActivities.map(a => a.facilitator).filter(f => f && f.trim()))].sort();
  filters.facilitators = new Set(uniqFacs);
  const uniqPeriods = [...new Set(allActivities.map(a => a.frequency_period).filter(Boolean))].sort();
  filters.frequencyPeriods = new Set(uniqPeriods);
  const allDurKeys = Object.keys(DURATION_LABELS);
  filters.durationRanges = new Set(allDurKeys);

  renderStats(summary);
  renderTypeBreakdown(summary.placed_by_type);
  renderFilters();
  renderActivities();
  renderConstraints(fullData.client_schedule);
  renderSkipped();
  buildCalendar(schedule, allTrips);
})();
</script>
